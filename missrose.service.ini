[Unit]
Description=MissRose Pro Telegram Bot
After=network.target

[Service]
Type=simple
User=ubuntu
WorkingDirectory=/home/ubuntu/missrose-pro
ExecStart=/home/ubuntu/missrose-pro/.venv/bin/python bot.py
Restart=always
RestartSec=10
StandardOutput=append:/home/ubuntu/missrose-pro/bot.log
StandardError=append:/home/ubuntu/missrose-pro/bot.log

[Install]
WantedBy=multi-user.target